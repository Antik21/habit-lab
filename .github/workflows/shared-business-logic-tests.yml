name: Shared business-logic tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ios-simulator:
    name: iOS simulator common tests
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=1g"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Verify selected Xcode
        run: xcodebuild -version
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Set up Android SDK required by the shared module configuration
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - name: Install the Android compile SDK
        run: sdkmanager --channel=3 --install "platforms;android-37.0" "build-tools;36.0.0"
      - name: Run shared checks on the iOS simulator
        run: ./gradlew :shared:check :shared:iosSimulatorArm64Test --stacktrace

  android-emulator:
    name: Android emulator common tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=1g"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - name: Install the Android compile SDK
        run: sdkmanager --channel=3 --install "platforms;android-37.0" "build-tools;36.0.0"
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run common tests on one Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          script: ./gradlew :shared:connectedAndroidDeviceTest --stacktrace
