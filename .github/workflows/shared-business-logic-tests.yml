name: Shared business-logic tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Check build logic and documentation
        run: ./gradlew :buildSrc:test checkDocumentation --stacktrace

  ios-simulator:
    name: iOS simulator common tests
    needs: documentation
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=1g"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Verify selected Xcode
        shell: bash
        run: |
          set -Eeuo pipefail
          xcode_version_output="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version_output"
          [[ "$(printf '%s\n' "$xcode_version_output" | sed -n '1p')" == 'Xcode 26.4.1' ]]
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Set up Android SDK required by the shared module configuration
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - name: Install the Android compile SDK
        run: sdkmanager --channel=3 --install "platforms;android-37.0" "build-tools;36.0.0"
      - name: Run shared checks on the iOS simulator
        run: ./gradlew :shared:check :shared:iosSimulatorArm64Test --stacktrace
      - name: Install Maestro CLI 2.6.1
        shell: bash
        run: |
          set -Eeuo pipefail
          readonly maestro_archive="$RUNNER_TEMP/maestro-2.6.1.zip"
          readonly maestro_root="$RUNNER_TEMP/maestro-2.6.1"
          readonly maestro_bin_dir="$maestro_root/maestro/bin"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            --output "$maestro_archive" \
            https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.6.1/maestro.zip
          printf '%s  %s\n' \
            '3440825f514f537c6a96bcf5de995780c2a4a7f83a43208fdc95d4f1fecfad3b' \
            "$maestro_archive" | shasum -a 256 -c -
          mkdir -p "$maestro_root"
          unzip -q "$maestro_archive" -d "$maestro_root"
          [[ -x "$maestro_bin_dir/maestro" ]]
          printf '%s\n' "$maestro_bin_dir" >> "$GITHUB_PATH"
          export PATH="$maestro_bin_dir:$PATH"
          maestro --version
          [[ "$(maestro --version)" == '2.6.1' ]]
      - name: Create job-owned iOS 26.4 simulator
        id: create-ios-simulator
        shell: bash
        run: |
          set -Eeuo pipefail
          readonly runtime_identifier='com.apple.CoreSimulator.SimRuntime.iOS-26-4'
          readonly device_type_identifier='com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro'
          readonly simulator_name="HabitLab-DEN21-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          xcrun simctl list runtimes -j | jq -e --arg identifier "$runtime_identifier" \
            '[.runtimes[] | select(.identifier == $identifier and .name == "iOS 26.4" and .version == "26.4" and .isAvailable == true)] | length == 1' \
            >/dev/null
          xcrun simctl list devicetypes -j | jq -e --arg identifier "$device_type_identifier" \
            '[.devicetypes[] | select(.identifier == $identifier and .name == "iPhone 17 Pro")] | length == 1' \
            >/dev/null
          readonly preexisting_named_simulator_uuids="$(xcrun simctl list devices -j | jq -r --arg name "$simulator_name" '
            [.devices[]?[]? | select(.name == $name) | .udid] | .[]
          ')"
          readonly create_output_file="$(mktemp "$RUNNER_TEMP/habit-lab-den21-simctl-create-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")"
          created_udid=''
          is_uuid() {
            local candidate="${1:-}"
            [[ "$candidate" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]
          }
          was_preexisting_named_simulator_udid() {
            local candidate="$1"
            local preexisting_udid=''
            while IFS= read -r preexisting_udid; do
              [[ -n "$preexisting_udid" && "$candidate" == "$preexisting_udid" ]] && return 0
            done <<< "$preexisting_named_simulator_uuids"
            return 1
          }
          read_created_udid() {
            local candidate=''
            [[ -r "$create_output_file" ]] || return 1
            candidate="$(tr -d '\r\n' < "$create_output_file")"
            is_uuid "$candidate" || return 1
            printf '%s\n' "$candidate"
          }
          find_unique_new_named_simulator_udid() {
            local current_named_simulator_uuids=''
            local candidate=''
            local selected_udid=''
            local new_count=0
            current_named_simulator_uuids="$(xcrun simctl list devices -j 2>/dev/null | jq -r --arg name "$simulator_name" '
              [.devices[]?[]? | select(.name == $name) | .udid] | .[]
            ' 2>/dev/null)" || return 1
            while IFS= read -r candidate; do
              [[ -n "$candidate" ]] || continue
              is_uuid "$candidate" || return 1
              if ! was_preexisting_named_simulator_udid "$candidate"; then
                selected_udid="$candidate"
                (( new_count += 1 ))
              fi
            done <<< "$current_named_simulator_uuids"
            (( new_count == 1 )) || return 1
            printf '%s\n' "$selected_udid"
          }
          cleanup_created_simulator() {
            local exit_status="$1"
            local cleanup_udid=''
            trap - EXIT ERR HUP INT TERM
            if is_uuid "$created_udid" && ! was_preexisting_named_simulator_udid "$created_udid"; then
              cleanup_udid="$created_udid"
            else
              cleanup_udid="$(read_created_udid 2>/dev/null || true)"
              if ! is_uuid "$cleanup_udid" || was_preexisting_named_simulator_udid "$cleanup_udid"; then
                cleanup_udid="$(find_unique_new_named_simulator_udid || true)"
              fi
            fi
            if is_uuid "$cleanup_udid"; then
              xcrun simctl shutdown "$cleanup_udid" >/dev/null 2>&1 || true
              xcrun simctl delete "$cleanup_udid" >/dev/null 2>&1 || true
            fi
            exit "$exit_status"
          }
          cleanup_on_exit() {
            local exit_status=$?
            cleanup_created_simulator "$exit_status"
          }
          cleanup_on_error() {
            local exit_status=$?
            cleanup_created_simulator "$exit_status"
          }
          cleanup_on_hup() {
            cleanup_created_simulator 129
          }
          cleanup_on_int() {
            cleanup_created_simulator 130
          }
          cleanup_on_term() {
            cleanup_created_simulator 143
          }
          trap cleanup_on_exit EXIT
          trap cleanup_on_error ERR
          trap cleanup_on_hup HUP
          trap cleanup_on_int INT
          trap cleanup_on_term TERM
          xcrun simctl create "$simulator_name" "$device_type_identifier" "$runtime_identifier" > "$create_output_file"
          created_udid="$(read_created_udid)"
          is_uuid "$created_udid"
          printf 'name=%s\nudid=%s\n' "$simulator_name" "$created_udid" >> "$GITHUB_OUTPUT"
          trap - EXIT ERR HUP INT TERM
      - name: Run Maestro parity smoke on the job-owned iOS simulator
        shell: bash
        env:
          MAESTRO_IOS_UDID: ${{ steps.create-ios-simulator.outputs.udid }}
        run: ./ui-tests/maestro/run.sh ios "$MAESTRO_IOS_UDID" ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
      - name: Verify iOS Maestro canonical evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          readonly artifact_dir="build/maestro/ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/ios"
          missing=0
          require_non_empty() {
            local artifact_path="$1"
            if [[ ! -s "$artifact_path" ]]; then
              printf 'error: expected non-empty Maestro artifact: %s\n' "$artifact_path" >&2
              missing=1
            fi
          }
          require_non_empty "$artifact_dir/command.log"
          require_non_empty "$artifact_dir/report.xml"
          require_non_empty "$artifact_dir/debug/maestro.log"
          require_non_empty "$artifact_dir/debug/commands-(reference-screens).json"
          screenshot_count=0
          if [[ -d "$artifact_dir/screenshots" ]]; then
            screenshot_count="$(find "$artifact_dir/screenshots" -type f -name '*.png' -print | wc -l | tr -d '[:space:]')"
          fi
          if ! [[ "$screenshot_count" =~ ^[0-9]+$ ]] || (( screenshot_count < 3 )); then
            printf 'error: expected at least 3 Maestro screenshots under %s/screenshots; found %s\n' \
              "$artifact_dir" "$screenshot_count" >&2
            missing=1
          fi
          (( missing == 0 ))
      - name: Upload iOS Maestro evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-ios-ci-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            build/maestro/ci-${{ github.run_id }}-${{ github.run_attempt }}/ios/command.log
            build/maestro/ci-${{ github.run_id }}-${{ github.run_attempt }}/ios/report.xml
            build/maestro/ci-${{ github.run_id }}-${{ github.run_attempt }}/ios/screenshots/**
            build/maestro/ci-${{ github.run_id }}-${{ github.run_attempt }}/ios/debug/**
            !build/maestro/ci-${{ github.run_id }}-${{ github.run_attempt }}/ios/DerivedData/**
      - name: Clean up job-owned iOS simulator
        if: always()
        shell: bash
        env:
          CREATED_IOS_SIMULATOR_NAME: ${{ steps.create-ios-simulator.outputs.name }}
          CREATED_IOS_SIMULATOR_UDID: ${{ steps.create-ios-simulator.outputs.udid }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$CREATED_IOS_SIMULATOR_UDID" ]]; then
            printf '%s\n' 'No job-owned iOS simulator was created.'
            exit 0
          fi
          [[ "$CREATED_IOS_SIMULATOR_UDID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]
          [[ -n "$CREATED_IOS_SIMULATOR_NAME" ]]
          xcrun simctl list devices | grep -F "$CREATED_IOS_SIMULATOR_NAME ($CREATED_IOS_SIMULATOR_UDID)" >/dev/null
          xcrun simctl shutdown "$CREATED_IOS_SIMULATOR_UDID" || true
          xcrun simctl delete "$CREATED_IOS_SIMULATOR_UDID"

  android-emulator:
    name: Android emulator common tests
    needs: documentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=1g"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - name: Install the Android compile SDK
        run: sdkmanager --channel=3 --install "platforms;android-37.0" "build-tools;36.0.0"
      - name: Install Maestro CLI 2.6.1
        shell: bash
        run: |
          set -Eeuo pipefail
          readonly maestro_archive="$RUNNER_TEMP/maestro-2.6.1.zip"
          readonly maestro_root="$RUNNER_TEMP/maestro-2.6.1"
          readonly maestro_bin_dir="$maestro_root/maestro/bin"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            --output "$maestro_archive" \
            https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.6.1/maestro.zip
          printf '%s  %s\n' \
            '3440825f514f537c6a96bcf5de995780c2a4a7f83a43208fdc95d4f1fecfad3b' \
            "$maestro_archive" | shasum -a 256 -c -
          mkdir -p "$maestro_root"
          unzip -q "$maestro_archive" -d "$maestro_root"
          [[ -x "$maestro_bin_dir/maestro" ]]
          printf '%s\n' "$maestro_bin_dir" >> "$GITHUB_PATH"
          export PATH="$maestro_bin_dir:$PATH"
          maestro --version
          [[ "$(maestro --version)" == '2.6.1' ]]
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run common tests on one Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          script: |
            ./gradlew :shared:connectedAndroidDeviceTest --stacktrace
            ./ui-tests/maestro/run.sh android emulator-5554 ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
      - name: Verify Android Maestro canonical evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          readonly artifact_dir="build/maestro/ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/android"
          missing=0
          require_non_empty() {
            local artifact_path="$1"
            if [[ ! -s "$artifact_path" ]]; then
              printf 'error: expected non-empty Maestro artifact: %s\n' "$artifact_path" >&2
              missing=1
            fi
          }
          require_non_empty "$artifact_dir/command.log"
          require_non_empty "$artifact_dir/report.xml"
          require_non_empty "$artifact_dir/debug/maestro.log"
          require_non_empty "$artifact_dir/debug/commands-(reference-screens).json"
          screenshot_count=0
          if [[ -d "$artifact_dir/screenshots" ]]; then
            screenshot_count="$(find "$artifact_dir/screenshots" -type f -name '*.png' -print | wc -l | tr -d '[:space:]')"
          fi
          if ! [[ "$screenshot_count" =~ ^[0-9]+$ ]] || (( screenshot_count < 3 )); then
            printf 'error: expected at least 3 Maestro screenshots under %s/screenshots; found %s\n' \
              "$artifact_dir" "$screenshot_count" >&2
            missing=1
          fi
          (( missing == 0 ))
      - name: Upload Android Maestro evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-android-ci-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            build/maestro/ci-${{ github.run_id }}-${{ github.run_attempt }}/android/command.log
            build/maestro/ci-${{ github.run_id }}-${{ github.run_attempt }}/android/report.xml
            build/maestro/ci-${{ github.run_id }}-${{ github.run_attempt }}/android/screenshots/**
            build/maestro/ci-${{ github.run_id }}-${{ github.run_attempt }}/android/debug/**
