appId: com.denis.habitlab
name: reference-screens
tags:
  - cross-platform
  - den-18
---
# This is the only runner-owned top-level scenario. DEN-18 subflows are resolved from this file.
- runFlow:
    file: ../../../.agents/skills/habit-lab-autodev/flows/launch-reference-fixture.yaml

- runFlow:
    file: ../../../.agents/skills/habit-lab-autodev/flows/open-daily-details.yaml
- runFlow:
    file: ../../../.agents/skills/habit-lab-autodev/flows/back-to-list-from-details.yaml

- runFlow:
    file: ../../../.agents/skills/habit-lab-autodev/flows/open-sleep-details.yaml
- runFlow:
    file: ../../../.agents/skills/habit-lab-autodev/flows/open-editor-from-details.yaml
- runFlow:
    file: ../../../.agents/skills/habit-lab-autodev/flows/back-to-details-from-editor.yaml
- runFlow:
    file: ../../../.agents/skills/habit-lab-autodev/flows/back-to-list-from-details.yaml

- runFlow:
    file: ../../../.agents/skills/habit-lab-autodev/flows/open-daily-details.yaml
- runFlow:
    file: ../../../.agents/skills/habit-lab-autodev/flows/open-daily-check-in-from-details.yaml
- runFlow:
    file: ../../../.agents/skills/habit-lab-autodev/flows/back-to-details-from-daily-check-in.yaml
- runFlow:
    file: ../../../.agents/skills/habit-lab-autodev/flows/record-daily-check-in.yaml
- runFlow:
    file: ../../../.agents/skills/habit-lab-autodev/flows/back-to-list-from-details.yaml

- runFlow:
    file: ../../../.agents/skills/habit-lab-autodev/flows/open-settings.yaml
- runFlow:
    when:
      platform: Android
    file: platform/android-system-back.yaml
- runFlow:
    when:
      platform: iOS
    file: platform/ios-edge-back.yaml

- runFlow:
    file: ../../../.agents/skills/habit-lab-autodev/flows/open-create-editor.yaml
- runFlow:
    file: ../../../.agents/skills/habit-lab-autodev/flows/select-daily-energy.yaml
- runFlow:
    file: ../../../.agents/skills/habit-lab-autodev/flows/save-reference-draft-to-details.yaml
- runFlow:
    file: ../../../.agents/skills/habit-lab-autodev/flows/cancel-delete-from-details.yaml
- runFlow:
    file: ../../../.agents/skills/habit-lab-autodev/flows/confirm-delete-to-list.yaml
- assertVisible:
    id: habitlab.experiment-list.screen.root
